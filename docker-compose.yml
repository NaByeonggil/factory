# 로컬 개발용 PostgreSQL
#   기동: docker compose up -d
#   중지: docker compose stop
#   삭제(데이터 포함): docker compose down -v
services:
  db:
    image: postgres:17-alpine
    container_name: factory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: factory
      # 한글 정렬·검색을 위한 로케일
      LANG: ko_KR.utf8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - factory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d factory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  factory-db-data:
