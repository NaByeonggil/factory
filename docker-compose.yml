# 로컬 개발용 PostgreSQL
#   기동: docker compose up -d
#   중지: docker compose stop
#   삭제(데이터 포함): docker compose down -v
services:
  db:
    image: postgres:17-alpine
    container_name: factory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: factory
      # 한글 정렬·검색을 위한 로케일
      LANG: ko_KR.utf8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # 호스트 루프백에만 공개 (LAN 노출 방지)
      - "127.0.0.1:5432:5432"
    volumes:
      - factory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d factory"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 프로덕션 앱 — factory.cancerwith.kr
  #   nh 스택의 nginx(nh_nginx)가 factory-app:3000 으로 프록시합니다.
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # 빌드 중 SSG 페이지가 DB를 읽어야 해서 호스트 네트워크로 붙입니다.
      network: host
      args:
        DATABASE_URL: "postgresql://dev:devpass@localhost:5432/factory?schema=public"
        NEXT_PUBLIC_SITE_URL: "https://factory.cancerwith.kr"
    image: factory-app
    container_name: factory-app
    restart: unless-stopped
    # 업로드 폴더(./storage/uploads)는 호스트 사용자(1000) 소유라, 이미지의
    # nextjs(1001) 그대로 돌리면 파일을 쓰지 못합니다(EACCES). 그룹만 호스트에
    # 맞춰 마운트한 폴더에 쓸 수 있게 합니다.
    user: "1001:1000"
    expose:
      - "3000"
    environment:
      DATABASE_URL: "postgresql://dev:devpass@db:5432/factory?schema=public"
      NEXT_PUBLIC_SITE_URL: "https://factory.cancerwith.kr"
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      IP_HASH_SALT: ${IP_HASH_SALT:?IP_HASH_SALT must be set in .env}
      STORAGE_DRIVER: "local"
      # 앱 폴더 밖(호스트 ./storage/uploads)에 bind mount 됩니다.
      UPLOAD_DIR: "/app/storage/uploads"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFY_FROM: ${NOTIFY_FROM:-}
      NOTIFY_TO: ${NOTIFY_TO:-}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-}
      SOLAPI_PFID: ${SOLAPI_PFID:-}
      SOLAPI_TEMPLATE_ID: ${SOLAPI_TEMPLATE_ID:-}
      SOLAPI_SENDER: ${SOLAPI_SENDER:-}
      NOTIFY_SMS_TO: ${NOTIFY_SMS_TO:-}
      # 견적·원가 시스템(datahealth) 연동 — 같은 도커 네트워크의 컨테이너 이름으로 부릅니다.
      # INTEGRATION_SECRET 이 비어 있으면 연동 기능 전체가 꺼집니다.
      INTEGRATION_SECRET: ${INTEGRATION_SECRET:-}
      DATAHEALTH_INTERNAL_URL: "http://datahealth-app:3000"
      DATAHEALTH_PUBLIC_URL: "https://data.cancerwith.kr"
      # AI 견적이 건기식 생산문의 게시판에 글을 올릴 때 쓰는 공유 키 — 비어 있으면 /api/integration/ai-quote 가 꺼집니다.
      AI_QUOTE_KEY: ${AI_QUOTE_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      NEXT_PUBLIC_NAVER_CONVERSION_ID: ${NEXT_PUBLIC_NAVER_CONVERSION_ID:-}
      NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
    volumes:
      - ./storage/uploads:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - nh_network

volumes:
  factory-db-data:

networks:
  # nh 스택의 nginx 와 같은 네트워크에 올라타 프록시를 받습니다.
  nh_network:
    external: true
    name: nh_nh_network
